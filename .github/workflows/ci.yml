name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.3', '8.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: mbstring, coverage: none}
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer analyse
      - run: composer lint
      # Box cannot clean up its temp directory on Windows runners; release PHARs are built on Ubuntu.
      - run: composer build
        if: runner.os != 'Windows'
      - run: composer verify-phar
        if: runner.os != 'Windows'
